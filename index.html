  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const tutorialOverlay = document.getElementById("swipe-tutorial-overlay");
    if (!tutorialOverlay) return;

    const hasSeenTutorial = localStorage.getItem("hasSeenSwipeTutorial");

    if (!hasSeenTutorial) {
        setTimeout(() => {
            tutorialOverlay.classList.add("active");
        }, 400);

        const dismissTutorial = () => {
            if (tutorialOverlay.classList.contains("active")) {
                tutorialOverlay.classList.remove("active");
                localStorage.setItem("hasSeenSwipeTutorial", "true");
            }
        };

        const timer = setTimeout(dismissTutorial, 3500);

        const handleAction = () => {
            clearTimeout(timer);
            dismissTutorial();
        };

        tutorialOverlay.addEventListener("touchstart", handleAction, { passive: true });
        tutorialOverlay.addEventListener("click", handleAction);
        window.addEventListener("wheel", handleAction, { passive: true });
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowDown" || e.key === "ArrowUp") handleAction();
        });
    }
});
  </script>
